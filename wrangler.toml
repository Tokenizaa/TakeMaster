name = "takemaster"
main = "worker-entry.ts"
compatibility_date = "2026-09-29"
compatibility_flags = ["nodejs_compat", "nodejs_compat_populate_process_env"]

[assets]
directory = "dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[vars]
NODE_ENV = "production"
CF_WORKER = "true"
NIM_BASE_URL = "https://integrate.api.nvidia.com"
NIM_PRIMARY_MODEL = "nvidia/nemotron-3-super-120b-a12b"
NIM_FALLBACK_MODEL = "nvidia/nemotron-3-ultra-550b-a55b"
NIM_TIMEOUT_MS = "60000"
SUPABASE_URL = "https://cvyoumtywnyayceoezru.supabase.co"
# SUPABASE_SERVICE_ROLE_KEY should be set as a secret in Cloudflare Dashboard
# wrangler secret put SUPABASE_SERVICE_ROLE_KEY
# NIM_API_KEY should be set as a secret in Cloudflare Dashboard
# wrangler secret put NIM_API_KEY



[observability]
enabled = true